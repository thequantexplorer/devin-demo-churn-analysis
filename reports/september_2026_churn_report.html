   "sql": "-- title: Monthly logo and MRR churn, Feb-Oct 2026\n-- description: Churn rate = subscriptions canceled in the month / subscriptions active on the 1st of the month. MRR churn uses the same denominator weighted by MRR.\nWITH months(m) AS (\n  VALUES ('2026-02'),('2026-03'),('2026-04'),('2026-05'),('2026-06'),\n         ('2026-07'),('2026-08'),('2026-09'),('2026-10')\n),\ngrid AS (\n  SELECT m.m AS month, s.*,\n         (s.started_at \u003c= m.m || '-01' AND (s.canceled_at IS NULL OR s.canceled_at >= m.m || '-01')) AS active_start,\n         (substr(s.canceled_at, 1, 7) = m.m) AS canceled_in_month\n  FROM months m CROSS JOIN subscriptions s\n)\nSELECT month,\n       SUM(active_start)                                                   AS active_start,\n       SUM(canceled_in_month)                                              AS cancellations,\n       ROUND(100.0 * SUM(canceled_in_month) / SUM(active_start), 2)        AS logo_churn_pct,\n       SUM(CASE WHEN active_start THEN mrr_cents END) / 100                AS mrr_start_usd,\n       COALESCE(SUM(CASE WHEN canceled_in_month THEN mrr_cents END), 0) / 100 AS lost_mrr_usd,\n       ROUND(100.0 * COALESCE(SUM(CASE WHEN canceled_in_month THEN mrr_cents END), 0)\n             / SUM(CASE WHEN active_start THEN mrr_cents END), 2)          AS mrr_churn_pct,\n       SUM(substr(started_at, 1, 7) = month)                               AS new_subscriptions\nFROM grid\nGROUP BY month\nORDER BY month;",

   "sql": "-- title: Headline: September vs August and vs the Mar-Aug baseline\n-- description: Baseline is the pooled Mar-Aug rate (total cancellations / total active-at-start subscription-months).\nWITH months(m) AS (\n  VALUES ('2026-03'),('2026-04'),('2026-05'),('2026-06'),('2026-07'),('2026-08'),('2026-09'),('2026-10')\n),\ngrid AS (\n  SELECT m.m AS month,\n         CASE WHEN m.m BETWEEN '2026-03' AND '2026-08' THEN 'baseline_mar_aug' ELSE m.m END AS period,\n         s.mrr_cents,\n         (s.started_at \u003c= m.m || '-01' AND (s.canceled_at IS NULL OR s.canceled_at >= m.m || '-01')) AS active_start,\n         (substr(s.canceled_at, 1, 7) = m.m) AS canceled_in_month\n  FROM months m CROSS JOIN subscriptions s\n)\nSELECT period,\n       SUM(active_start)                                             AS active_sub_months,\n       SUM(canceled_in_month)                                        AS cancellations,\n       ROUND(100.0 * SUM(canceled_in_month) / SUM(active_start), 2)  AS logo_churn_pct,\n       ROUND(100.0 * COALESCE(SUM(CASE WHEN canceled_in_month THEN mrr_cents END), 0)\n             / SUM(CASE WHEN active_start THEN mrr_cents END), 2)    AS mrr_churn_pct\nFROM grid\nWHERE month IN ('2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10')\nGROUP BY period\nUNION ALL\nSELECT '2026-08', SUM(active_start), SUM(canceled_in_month),\n       ROUND(100.0 * SUM(canceled_in_month) / SUM(active_start), 2),\n       ROUND(100.0 * COALESCE(SUM(CASE WHEN canceled_in_month THEN mrr_cents END), 0)\n             / SUM(CASE WHEN active_start THEN mrr_cents END), 2)\nFROM grid WHERE month = '2026-08'\nORDER BY period;",

  "05_region_x_payment": {
   "file": "analysis/queries/05_region_x_payment.sql",
   "title": "Churn by region x payment method and month (the interaction)",
   "description": "Isolates the cell touched by release 4.7.0 (EU + card) and its natural controls (EU + invoice, non-EU + card).",
   "sql": "-- title: Churn by region x payment method and month (the interaction)\n-- description: Isolates the cell touched by release 4.7.0 (EU + card) and its natural controls (EU + invoice, non-EU + card).\nWITH months(m) AS (\n  VALUES ('2026-03'),('2026-04'),('2026-05'),('2026-06'),('2026-07'),('2026-08'),('2026-09'),('2026-10')\n),\npm AS (SELECT account_id, MAX(payment_method) AS payment_method FROM invoices GROUP BY account_id),\ngrid AS (\n  SELECT m.m AS month, a.region, pm.payment_method, s.mrr_cents,\n         (s.started_at \u003c= m.m || '-01' AND (s.canceled_at IS NULL OR s.canceled_at >= m.m || '-01')) AS active_start,\n         (substr(s.canceled_at, 1, 7) = m.m) AS canceled_in_month\n  FROM months m CROSS JOIN subscriptions s\n  JOIN accounts a ON a.id = s.account_id\n  JOIN pm ON pm.account_id = s.account_id\n)\nSELECT region, payment_method, month,\n       SUM(active_start)                                             AS active_start,\n       SUM(canceled_in_month)                                        AS cancellations,\n       ROUND(100.0 * SUM(canceled_in_month) / SUM(active_start), 2)  AS logo_churn_pct,\n       COALESCE(SUM(CASE WHEN canceled_in_month THEN mrr_cents END), 0) / 100 AS lost_mrr_usd\nFROM grid\nGROUP BY region, payment_method, month\nORDER BY region, payment_method, month;",

    "region",

  "06_invoice_collection": {
   "file": "analysis/queries/06_invoice_collection.sql",
   "title": "Invoice collection by period, region and payment method",
   "description": "Share of invoices that ended uncollectible, and average payment attempts. This is the mechanism check for the PSP migration.",
   "sql": "-- title: Invoice collection by period, region and payment method\n-- description: Share of invoices that ended uncollectible, and average payment attempts. This is the mechanism check for the PSP migration.\nSELECT i.period,\n       a.region,\n       i.payment_method,\n       COUNT(*)                                                     AS invoices,\n       SUM(i.status = 'uncollectible')                              AS uncollectible,\n       ROUND(100.0 * SUM(i.status = 'uncollectible') / COUNT(*), 2) AS uncollectible_pct,\n       ROUND(AVG(i.attempts), 2)                                    AS avg_attempts,\n       SUM(i.attempts > 1)                                          AS invoices_needing_retry\nFROM invoices i\nJOIN accounts a ON a.id = i.account_id\nGROUP BY i.period, a.region, i.payment_method\nORDER BY i.period, a.region, i.payment_method;",
   "columns": [
    "period",
    "region",
    "payment_method",

  "07_support_tickets": {
   "file": "analysis/queries/07_support_tickets.sql",
   "title": "Support tickets by subject and month, with EU share",
   "description": "Ticket volume and average sentiment per subject. eu_tickets counts tickets from EU accounts.",
   "sql": "-- title: Support tickets by subject and month, with EU share\n-- description: Ticket volume and average sentiment per subject. eu_tickets counts tickets from EU accounts.\nSELECT substr(t.created_at, 1, 7)    AS month,\n       t.category,\n       t.subject,\n       COUNT(*)                      AS tickets,\n       SUM(a.region = 'EU')          AS eu_tickets,\n       ROUND(AVG(t.sentiment), 2)    AS avg_sentiment\nFROM support_tickets t\nJOIN accounts a ON a.id = t.account_id\nGROUP BY month, t.category, t.subject\nORDER BY month, t.category, t.subject;",
   "columns": [
    "month",
    "category",
    "subject",

  "08_daily_cancellations": {
   "file": "analysis/queries/08_daily_cancellations.sql",
   "title": "Daily cancellations, Jul-Oct 2026, split EU-card payment failures vs everything else",
   "description": "Used to line the spike up against release dates (4.7.0 on 2026-08-18, 4.8.0 on 2026-09-09).",
   "sql": "-- title: Daily cancellations, Jul-Oct 2026, split EU-card payment failures vs everything else\n-- description: Used to line the spike up against release dates (4.7.0 on 2026-08-18, 4.8.0 on 2026-09-09).\nWITH pm AS (SELECT account_id, MAX(payment_method) AS payment_method FROM invoices GROUP BY account_id)\nSELECT s.canceled_at AS day,\n       SUM(a.region = 'EU' AND pm.payment_method = 'card' AND s.cancel_reason = 'payment_failed')        AS eu_card_payment_failed,\n       SUM(NOT (a.region = 'EU' AND pm.payment_method = 'card' AND s.cancel_reason = 'payment_failed'))  AS all_other\nFROM subscriptions s\nJOIN accounts a ON a.id = s.account_id\nJOIN pm ON pm.account_id = s.account_id\nWHERE s.canceled_at BETWEEN '2026-07-01' AND '2026-10-31'\nGROUP BY s.canceled_at\nORDER BY s.canceled_at;",

  "10_did_groups": {
   "file": "analysis/queries/10_did_groups.sql",
   "title": "Difference-in-differences: EU-card vs control groups, pre (Jun-Aug) vs post (Sep-Oct)",
   "description": "Monthly churn rate pooled over each window (cancellations / active-at-start subscription-months).",
   "sql": "-- title: Difference-in-differences: EU-card vs control groups, pre (Jun-Aug) vs post (Sep-Oct)\n-- description: Monthly churn rate pooled over each window (cancellations / active-at-start subscription-months).\nWITH months(m) AS (VALUES ('2026-06'),('2026-07'),('2026-08'),('2026-09'),('2026-10')),\npm AS (SELECT account_id, MAX(payment_method) AS payment_method FROM invoices GROUP BY account_id),\ngrid AS (\n  SELECT CASE WHEN m.m \u003c= '2026-08' THEN 'pre_jun_aug' ELSE 'post_sep_oct' END AS window,\n         CASE WHEN a.region = 'EU' THEN 'EU' ELSE 'non-EU' END || ' / ' || pm.payment_method AS grp,\n         (s.started_at \u003c= m.m || '-01' AND (s.canceled_at IS NULL OR s.canceled_at >= m.m || '-01')) AS active_start,\n         (substr(s.canceled_at, 1, 7) = m.m) AS canceled_in_month\n  FROM months m CROSS JOIN subscriptions s\n  JOIN accounts a ON a.id = s.account_id\n  JOIN pm ON pm.account_id = s.account_id\n)\nSELECT grp, window,\n       SUM(active_start)                                             AS active_sub_months,\n       SUM(canceled_in_month)                                        AS cancellations,\n       ROUND(100.0 * SUM(canceled_in_month) / SUM(active_start), 2)  AS logo_churn_pct\nFROM grid\nGROUP BY grp, window\nORDER BY grp, window DESC;",
   "columns": [
    "grp",
    "window",
    "active_sub_months",
    "cancellations",
    "logo_churn_pct"
   ],
   "rows": [

   "sql": "-- title: Team plan price change test (4.8.0: $99 -> $129 for new signups only)\n-- description: Compares Team subscribers on the old vs new price, and tracks too_expensive cancellations and \"Price went up?\" tickets.\nSELECT 'team_cohort' AS view,\n       CASE WHEN mrr_cents = 12900 THEN '$129 (new signups from 2026-09-09)' ELSE '$99 (existing)' END AS segment,\n       COUNT(*)                              AS subscriptions,\n       SUM(canceled_at >= '2026-09-01')      AS canceled_sep_oct,\n       SUM(cancel_reason = 'too_expensive' AND canceled_at >= '2026-09-01') AS too_expensive_sep_oct\nFROM subscriptions\nWHERE plan = 'team'\nGROUP BY segment\nUNION ALL\nSELECT 'too_expensive_by_month', substr(canceled_at, 1, 7), COUNT(*), NULL, NULL\nFROM subscriptions\nWHERE cancel_reason = 'too_expensive'\nGROUP BY substr(canceled_at, 1, 7)\nUNION ALL\nSELECT 'price_tickets_by_month', substr(created_at, 1, 7), COUNT(*), NULL, NULL\nFROM support_tickets\nWHERE subject = 'Price went up?'\nGROUP BY substr(created_at, 1, 7)\nORDER BY 1, 2;",

  "12_usage_before_cancel": {
   "file": "analysis/queries/12_usage_before_cancel.sql",
   "title": "Product engagement of September-October churners before they canceled",
   "description": "Seat utilization (weekly active users / seats) in the 8 weeks before cancellation vs the 8 weeks before that. usage_daily covers a 25% sample of accounts, so n is small.",
   "sql": "-- title: Product engagement of September-October churners before they canceled\n-- description: Seat utilization (weekly active users / seats) in the 8 weeks before cancellation vs the 8 weeks before that. usage_daily covers a 25% sample of accounts, so n is small.\nWITH pm AS (SELECT account_id, MAX(payment_method) AS payment_method FROM invoices GROUP BY account_id),\nchurners AS (\n  SELECT s.account_id, s.canceled_at, a.seats,\n         CASE WHEN a.region = 'EU' AND pm.payment_method = 'card' AND s.cancel_reason = 'payment_failed'\n              THEN 'EU card, payment_failed' ELSE 'All other churners' END AS grp\n  FROM subscriptions s\n  JOIN accounts a ON a.id = s.account_id\n  JOIN pm ON pm.account_id = s.account_id\n  WHERE s.canceled_at >= '2026-09-01'\n),\nper_account AS (\n  SELECT c.grp, c.account_id,\n         AVG(CASE WHEN u.day BETWEEN date(c.canceled_at, '-56 days') AND date(c.canceled_at, '-1 day')\n                  THEN 1.0 * u.active_users / c.seats END)  AS util_last_8w,\n         AVG(CASE WHEN u.day BETWEEN date(c.canceled_at, '-112 days') AND date(c.canceled_at, '-57 days')\n                  THEN 1.0 * u.active_users / c.seats END)  AS util_prior_8w\n  FROM churners c\n  JOIN usage_daily u ON u.account_id = c.account_id\n  GROUP BY c.grp, c.account_id\n)\nSELECT grp,\n       COUNT(*)                              AS sampled_accounts,\n       ROUND(100 * AVG(util_prior_8w), 1)    AS seat_util_pct_prior_8w,\n       ROUND(100 * AVG(util_last_8w), 1)     AS seat_util_pct_last_8w\nFROM per_account\nGROUP BY grp\nUNION ALL\nSELECT 'Retained accounts (Aug-Oct)',\n       COUNT(DISTINCT u.account_id), NULL,\n       ROUND(100 * AVG(1.0 * u.active_users / a.seats), 1)\nFROM usage_daily u\nJOIN accounts a ON a.id = u.account_id\nJOIN subscriptions s ON s.account_id = u.account_id\nWHERE s.canceled_at IS NULL AND u.day >= '2026-08-01';",
   "columns": [
    "grp",
    "sampled_accounts",
    "seat_util_pct_prior_8w",
    "seat_util_pct_last_8w"
   ],
   "rows": [
    {
     "grp": "All other churners",
     "sampled_accounts": 16,
     "seat_util_pct_prior_8w": 57.8,
     "seat_util_pct_last_8w": 55.2
    },
    {
     "grp": "EU card, payment_failed",
     "sampled_accounts": 49,
     "seat_util_pct_prior_8w": 58.4,
     "seat_util_pct_last_8w": 59.2
    },
    {
     "grp": "Retained accounts (Aug-Oct)",
     "sampled_accounts": 261,
     "seat_util_pct_prior_8w": null,
     "seat_util_pct_last_8w": 59.5
    }
   ]
  },
  "13_revenue_impact": {
   "file": "analysis/queries/13_revenue_impact.sql",
   "title": "Revenue impact of the EU card payment failures",
   "description": "Excess = actual EU-card lost MRR minus expected lost MRR at the segment's own Mar-Aug MRR churn rate. Also reports EU-card MRR still exposed.",
   "sql": "-- title: Revenue impact of the EU card payment failures\n-- description: Excess = actual EU-card lost MRR minus expected lost MRR at the segment's own Mar-Aug MRR churn rate. Also reports EU-card MRR still exposed.\nWITH months(m) AS (\n  VALUES ('2026-03'),('2026-04'),('2026-05'),('2026-06'),('2026-07'),('2026-08'),('2026-09'),('2026-10')\n),\npm AS (SELECT account_id, MAX(payment_method) AS payment_method FROM invoices GROUP BY account_id),\neu_card AS (\n  SELECT s.* FROM subscriptions s\n  JOIN accounts a ON a.id = s.account_id\n  JOIN pm ON pm.account_id = s.account_id\n  WHERE a.region = 'EU' AND pm.payment_method = 'card'\n),\ngrid AS (\n  SELECT m.m AS month, e.mrr_cents,\n         (e.started_at \u003c= m.m || '-01' AND (e.canceled_at IS NULL OR e.canceled_at >= m.m || '-01')) AS active_start,\n         (substr(e.canceled_at, 1, 7) = m.m) AS canceled_in_month\n  FROM months m CROSS JOIN eu_card e\n),\nmonthly AS (\n  SELECT month,\n         SUM(active_start) AS active_start,\n         SUM(canceled_in_month) AS cancellations,\n         SUM(CASE WHEN active_start THEN mrr_cents END) / 100.0 AS mrr_start,\n         COALESCE(SUM(CASE WHEN canceled_in_month THEN mrr_cents END), 0) / 100.0 AS lost_mrr\n  FROM grid GROUP BY month\n),\nbaseline AS (\n  SELECT 1.0 * SUM(cancellations) / SUM(active_start) AS logo_rate,\n         SUM(lost_mrr) / SUM(mrr_start)               AS mrr_rate\n  FROM monthly WHERE month BETWEEN '2026-03' AND '2026-08'\n)\nSELECT m.month,\n       m.active_start,\n       m.cancellations,\n       ROUND(m.active_start * b.logo_rate, 1)                 AS expected_cancellations,\n       ROUND(m.cancellations - m.active_start * b.logo_rate)  AS excess_cancellations,\n       ROUND(m.lost_mrr)                                      AS lost_mrr_usd,\n       ROUND(m.mrr_start * b.mrr_rate)                        AS expected_lost_mrr_usd,\n       ROUND(m.lost_mrr - m.mrr_start * b.mrr_rate)           AS excess_lost_mrr_usd,\n       ROUND(100 * b.logo_rate, 2)                            AS baseline_logo_churn_pct,\n       ROUND(100 * b.mrr_rate, 2)                             AS baseline_mrr_churn_pct,\n       (SELECT SUM(mrr_cents) / 100 FROM eu_card WHERE canceled_at IS NULL)  AS eu_card_mrr_still_active_usd,\n       (SELECT COUNT(*) FROM eu_card WHERE canceled_at IS NULL)              AS eu_card_subs_still_active,\n       (SELECT SUM(mrr_cents) / 100 FROM subscriptions WHERE canceled_at IS NULL) AS total_mrr_active_usd\nFROM monthly m CROSS JOIN baseline b\nWHERE m.month IN ('2026-09', '2026-10')\nORDER BY m.month;",
   "columns": [
    "month",
    "active_start",
    "cancellations",
    "expected_cancellations",
    "excess_cancellations",
    "lost_mrr_usd",
    "expected_lost_mrr_usd",
    "excess_lost_mrr_usd",
    "baseline_logo_churn_pct",
    "baseline_mrr_churn_pct",
    "eu_card_mrr_still_active_usd",
    "eu_card_subs_still_active",
    "total_mrr_active_usd"
   ],
   "rows": [

  "14_ticket_churn_link": {
   "file": "analysis/queries/14_ticket_churn_link.sql",
   "title": "Did billing tickets after the PSP migration precede churn?",
   "description": "Subscriptions active on 2026-09-01, split by whether the account filed a billing ticket on/after 2026-08-18, and the share that canceled in Sep-Oct.",
   "sql": "-- title: Did billing tickets after the PSP migration precede churn?\n-- description: Subscriptions active on 2026-09-01, split by whether the account filed a billing ticket on/after 2026-08-18, and the share that canceled in Sep-Oct.\nWITH pm AS (SELECT account_id, MAX(payment_method) AS payment_method FROM invoices GROUP BY account_id),\nticketed AS (\n  SELECT DISTINCT account_id FROM support_tickets\n  WHERE category = 'billing' AND created_at >= '2026-08-18'\n)\nSELECT CASE WHEN a.region = 'EU' AND pm.payment_method = 'card' THEN 'EU / card' ELSE 'All other' END AS grp,\n       CASE WHEN t.account_id IS NOT NULL THEN 'billing ticket since 08-18' ELSE 'no billing ticket' END AS ticket_status,\n       COUNT(*)                                                        AS subs_active_sep1,\n       SUM(s.canceled_at IS NOT NULL)                                  AS canceled_sep_oct,\n       ROUND(100.0 * SUM(s.canceled_at IS NOT NULL) / COUNT(*), 1)     AS canceled_pct\nFROM subscriptions s\nJOIN accounts a ON a.id = s.account_id\nJOIN pm ON pm.account_id = s.account_id\nLEFT JOIN ticketed t ON t.account_id = s.account_id\nWHERE s.started_at \u003c= '2026-09-01' AND (s.canceled_at IS NULL OR s.canceled_at >= '2026-09-01')\nGROUP BY grp, ticket_status\nORDER BY grp, ticket_status;",
   "columns": [
    "grp",
    "ticket_status",
    "subs_active_sep1",
    "canceled_sep_oct",
    "canceled_pct"
